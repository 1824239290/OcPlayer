name: 'Set up Erika kernel'
description: 'Resolve Erika fork version, restore binaries from cache, fetch if missing.'
inputs:
  erika-version:
    description: 'Erika fork tag, e.g. v0.1.7+readahead.1'
    required: true
outputs:
  version:
    description: 'Resolved full version'
    value: ${{ steps.erika.outputs.version }}
runs:
  using: composite
  steps:
    - name: Resolve Erika version
      id: erika
      shell: bash
      run: |
        set -euo pipefail
        resolved_version="$(Scripts/fetch-erika.sh --resolve-version "${{ inputs.erika-version }}")"
        echo "version=$resolved_version" >> "$GITHUB_OUTPUT"
        echo "ERIKA_VERSION=$resolved_version" >> "$GITHUB_ENV"

    - name: Cache Erika binaries
      uses: actions/cache@v4
      with:
        path: |
          Vendor/downloads
          Vendor/extracted
          Packages/ErikaKit/Vendor/Erika.xcframework
        key: erika-${{ runner.os }}-${{ runner.arch }}-${{ steps.erika.outputs.version }}

    - name: Fetch Erika kernel
      shell: bash
      run: Scripts/fetch-erika.sh "$ERIKA_VERSION"
