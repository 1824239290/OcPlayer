name: Test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  macos:
    name: macOS + iOS tests (AppTests + SwiftPM packages)
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Resolve Erika version
        id: erika-version
        shell: bash
        run: |
          set -euo pipefail
          version="$(awk -F= '/^[[:space:]]*ERIKA_VERSION[[:space:]]*=/ {sub(/^[^=]*=[[:space:]]*/, ""); print; exit}' Config/Erika.version)"
          if [[ -z "$version" ]]; then
            echo "Config/Erika.version 里没有 ERIKA_VERSION= 行" >&2
            exit 3
          fi
          echo "ERIKA_VERSION=$version" >> "$GITHUB_ENV"
          echo "内核版本（来自 Config/Erika.version）: $version"

      - name: Set up Erika kernel
        uses: ./.github/actions/setup-erika
        with:
          erika-version: ${{ env.ERIKA_VERSION }}

      # key **不要**带 github.sha：那样只有「同一次 run 重跑」才命中，每个 PR 都 miss
      # 却照样 save 一条 2.6 GiB 快照，把 10 GB 仓库额度打成 LRU 抖动（实测曾同时躺着
      # 3 条只差 sha 的僵尸条目）。去掉 sha 后主键稳定命中，条目回到每个 workflow 一条。
      # 前缀 `spm-test-` 是必需的：release.yml 那个块缓存的是**不同路径**
      # （ci-release-test），两边 key 若逐字相同会互相顶掉。`-v1-` 是留给将来的失效旋钮。
      - name: Cache SwiftPM builds
        uses: actions/cache@v4
        with:
          path: |
            .local-build/ci-test
            Packages/*/.build
          key: spm-test-v1-${{ runner.os }}-${{ hashFiles('**/Package.resolved') }}
          restore-keys: |
            spm-test-v1-${{ runner.os }}-

      # iOS 那步是 job 里唯一没有被缓存、且波动最大的一步（2026-10-17 两次运行实测
      # 462 s ↔ 627 s，而同一次运行里命中缓存的 macOS 步只要 100 s）。它的耗时构成是
      # 解析 ~57 s + 编译 ~403 s + 用例 ~110 s + 收尾 ~48 s，前两项正是 DerivedData 里
      # 的东西 —— 本机同根实测：冷建 116 s → 改两个源文件后增量 14 s，体积 1.9 GB。
      #
      # **单独一条**而不是并进上面那条 `spm-test-`：它只服务 iOS 这一步，胖了 / 坏了
      # 可以单独删掉，不必连 macOS 与包构建的缓存一起丢；key 前缀不同，两者不会互相顶掉。
      # 主键同样只由 Package.resolved 决定 ⇒ 依赖没变的 PR 精确命中、且**命中的运行不会
      # 再写一条新的**（见 PR #29 第二次运行的 `Cache hit occurred on the primary key,
      # not saving cache`）。依赖变了的 PR 会新写一条 ~1.9 GB 的 PR 作用域副本，靠合并后
      # 删 PR 副本回收（条目按 ref 隔离，详见 CHANGELOG BLD-04 条）。
      # `-v1-` 是失效旋钮：换 runner 镜像 / Xcode 大版本时 bump。
      - name: Cache iOS DerivedData
        uses: actions/cache@v4
        with:
          path: .local-build/ci-test-ios
          key: ios-dd-v1-${{ runner.os }}-${{ hashFiles('**/Package.resolved') }}
          restore-keys: |
            ios-dd-v1-${{ runner.os }}-

      # OcPlayer-macOS scheme 的 TestAction 只挂 OcPlayerTests（纯逻辑，不依赖内核/网络/GPU）；
      # 渲染集成测试在 SPM 包内，下面单独跑。
      - name: Run App tests (macOS scheme)
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild \
            -project OcPlayer.xcodeproj \
            -scheme OcPlayer-macOS \
            -configuration Debug \
            -destination 'platform=macOS' \
            -derivedDataPath .local-build/ci-test \
            test

      # iOS 与 macOS 共用同一份 OcPlayerTests 源码（OcPlayerTests-iOS target +
      # OcPlayer-iOS.xcscheme 早已存在），此前 CI 只跑 macOS destination，iOS 独有
      # 路径（方向锁、文件选择器生命周期）无回归。runner 可用机型随镜像变化，
      # 用 simctl 动态取第一个可用 iPhone，不写死机型名。
      - name: Run App tests (iOS simulator)
        shell: bash
        run: |
          set -euo pipefail
          device="$(xcrun simctl list devices available -j \
            | jq -r '[.devices[][] | select(.name | startswith("iPhone"))][0].name')"
          if [[ -z "$device" || "$device" == "null" ]]; then
            echo "No iPhone simulator available on this runner" >&2
            exit 1
          fi
          echo "==> iOS simulator: $device"
          xcodebuild \
            -project OcPlayer.xcodeproj \
            -scheme OcPlayer-iOS \
            -configuration Debug \
            -destination "platform=iOS Simulator,name=$device" \
            -derivedDataPath .local-build/ci-test-ios \
            test

      - name: Run SwiftPM package tests
        shell: bash
        run: |
          set -euo pipefail
          for pkg in \
              Packages/AppDesignKit \
              Packages/CoreModel \
              Packages/DiagnosticsKit \
              Packages/PlaybackKit \
              Packages/DanmakuKit \
              Packages/DanmakuRenderKit \
              Packages/JellyfinKit \
              Packages/BangumiKit \
              Packages/MetadataKit \
              Packages/MoviePilotKit; do
            echo "==> $pkg"
            swift test --package-path "$pkg"
          done
          # ErikaKit 里实例化 ErikaPresenter 的 Swift Testing suite 依赖 Metal / 真内核，
          # 无 GPU 的 GitHub runner 上会直接 hang（不是报错），只能全 skip：
          # 离屏渲染 / C ABI 冒烟 / 打开真文件 / HTTP 直连 / 播放生命周期 / 内存快照
          # / 预读行为（会 try ErikaPresenter()，随预读内核 API 加入）。
          # 留下的 XCTest（弹幕 JSON/配置/轨道/状态）是纯逻辑，不碰内核。
          echo "==> Packages/ErikaKit (excluding presenter-dependent suites)"
          swift test --package-path Packages/ErikaKit \
            --skip ErikaRenderTests --skip ErikaSmokeTests --skip ErikaOpenFileTests \
            --skip ErikaHTTPHeaderTests --skip ErikaLifecycleTests --skip ErikaMemorySnapshotTests \
            --skip ErikaReadAheadBehaviorTests

      - name: Upload test logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-logs
          path: |
            .local-build/ci-test/Logs
            .local-build/ci-test/Logs/Test/*.xcresult
          if-no-files-found: ignore
