name: Test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  macos:
    name: macOS + iOS tests (AppTests + SwiftPM packages)
    runs-on: macos-26
    timeout-minutes: 60
    env:
      ERIKA_VERSION: v0.2.0

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Erika kernel
        uses: ./.github/actions/setup-erika
        with:
          erika-version: ${{ env.ERIKA_VERSION }}

      - name: Cache SwiftPM builds
        uses: actions/cache@v4
        with:
          path: |
            .local-build/ci-test
            Packages/*/.build
          key: spm-${{ runner.os }}-${{ hashFiles('**/Package.resolved') }}-${{ github.sha }}
          restore-keys: |
            spm-${{ runner.os }}-${{ hashFiles('**/Package.resolved') }}-
            spm-${{ runner.os }}-

      # OcPlayer-macOS scheme 的 TestAction 只挂 OcPlayerTests（纯逻辑，不依赖内核/网络/GPU）；
      # 渲染集成测试在 SPM 包内，下面单独跑。
      - name: Run App tests (macOS scheme)
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild \
            -project OcPlayer.xcodeproj \
            -scheme OcPlayer-macOS \
            -configuration Debug \
            -destination 'platform=macOS' \
            -derivedDataPath .local-build/ci-test \
            test

      # iOS 与 macOS 共用同一份 OcPlayerTests 源码（OcPlayerTests-iOS target +
      # OcPlayer-iOS.xcscheme 早已存在），此前 CI 只跑 macOS destination，iOS 独有
      # 路径（方向锁、文件选择器生命周期）无回归。runner 可用机型随镜像变化，
      # 用 simctl 动态取第一个可用 iPhone，不写死机型名。
      - name: Run App tests (iOS simulator)
        shell: bash
        run: |
          set -euo pipefail
          device="$(xcrun simctl list devices available -j \
            | jq -r '[.devices[][] | select(.name | startswith("iPhone"))][0].name')"
          if [[ -z "$device" || "$device" == "null" ]]; then
            echo "No iPhone simulator available on this runner" >&2
            exit 1
          fi
          echo "==> iOS simulator: $device"
          xcodebuild \
            -project OcPlayer.xcodeproj \
            -scheme OcPlayer-iOS \
            -configuration Debug \
            -destination "platform=iOS Simulator,name=$device" \
            -derivedDataPath .local-build/ci-test-ios \
            test

      - name: Run SwiftPM package tests
        shell: bash
        run: |
          set -euo pipefail
          for pkg in \
              Packages/AppDesignKit \
              Packages/CoreModel \
              Packages/DiagnosticsKit \
              Packages/PlaybackKit \
              Packages/DanmakuKit \
              Packages/DanmakuRenderKit \
              Packages/JellyfinKit \
              Packages/BangumiKit \
              Packages/MoviePilotKit; do
            echo "==> $pkg"
            swift test --package-path "$pkg"
          done
          # ErikaKit 里实例化 ErikaPresenter 的 Swift Testing suite 依赖 Metal / 真内核，
          # 无 GPU 的 GitHub runner 上会直接 hang（不是报错），只能全 skip：
          # 离屏渲染 / C ABI 冒烟 / 打开真文件 / HTTP 直连 / 播放生命周期 / 内存快照
          # / 预读行为（会 try ErikaPresenter()，随预读内核 API 加入）。
          # 留下的 XCTest（弹幕 JSON/配置/轨道/状态）是纯逻辑，不碰内核。
          echo "==> Packages/ErikaKit (excluding presenter-dependent suites)"
          swift test --package-path Packages/ErikaKit \
            --skip ErikaRenderTests --skip ErikaSmokeTests --skip ErikaOpenFileTests \
            --skip ErikaHTTPHeaderTests --skip ErikaLifecycleTests --skip ErikaMemorySnapshotTests \
            --skip ErikaReadAheadBehaviorTests

      - name: Upload test logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-logs
          path: |
            .local-build/ci-test/Logs
            .local-build/ci-test/Logs/Test/*.xcresult
          if-no-files-found: ignore
