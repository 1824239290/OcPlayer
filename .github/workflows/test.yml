name: Test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

# ## `BLD-09`：测试门禁拆成三个**并行** job（2026-11-04）
#
# 拆之前是一个 job，三步串行。实测（#86 `41676015501`，34 分 27 秒）：
#
#   准备    Set up Erika 16 s · Cache SwiftPM 64 s · Cache iOS DD 27 s · Seed/Cache release 98 s
#   测试①   Run App tests (macOS)        357 s
#   测试②   Run App tests (iOS 模拟器)    805 s   ← 121 s 预热 + 422 s 编译 + ~112 s 用例 + 收尾
#   测试③   Run SwiftPM package tests     706 s
#   收尾    ~70 s
#
# 三步互不依赖：macOS 用本机产物、iOS 用模拟器、SwiftPM 是每个包各跑 `swift test`，
# 而且**各自用各自的 DerivedData / `.build` 目录** —— 串行只是沿用了「一个 job」的历史形状。
# 拆成三个 job 之后墙钟 = max(三者) + 准备。**实测两轮（PR #88 `41696040694`）**：
#   首轮（三条缓存全冷）  17m00s   macOS 8m14s / iOS 14m24s / spm 16m59s  ← spm 是关键路径
#   第二轮（三条全命中）  11m34s   macOS 4m01s / iOS 11m34s / spm 4m21s   ← iOS 是关键路径
# 对照拆分前的 35m09s（`41676015501`）：暖态 **-67%**。首轮的冷启动是一次性的。
#
# **拆开后给缓存 key 分开不是优化，是正确性**：三个 job 跑在三台不同的 runner 上，各自
# 恢复一份自己的副本。如果两条 `actions/cache` 用**同一个 key 但 path 不同**，谁先保存谁赢，
# 另一个 job 那次构建的内容会被**静默丢掉**（日志只有一句 warning），下次照旧 miss。
# 所以：`.local-build/ci-test` → `mac-dd-v1`，`Packages/*/.build` → `spm-test-v2`，
# `.local-build/ci-test-ios` → `ios-dd-v1`（不变），三者互不重叠。
#
# 已知副作用（可接受，别当故障查）：
# 1. Erika 内核那条 `erika-<os>-<arch>-<version>` 三个 job 都用。版本没变时是精确命中
#    （只读不写）；**只有在 `Config/Erika.version` 改了的新提交上**三个 job 会同时 miss，
#    于是各下载一次 ≈308 MiB 并抢着写同一个 key —— 只有一个能写成功，其余打印
#    `Unable to reserve cache with key …` 的 **warning**（不是失败）。下次运行就回到精确命中。
# 2. 三个 job 各付一次 checkout + setup-erika + cache restore ≈ 100 s。总 runner 分钟数
#    比串行时多约 3 分钟，但墙钟少 18 分钟；公开仓库 runner 免费，只有并发额度成本。

jobs:
  # ── 1/3  macOS AppTests ────────────────────────────────────────────────────
  macos-apptests:
    name: App tests (macOS)
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Resolve Erika version
        id: erika-version
        shell: bash
        run: |
          set -euo pipefail
          version="$(awk -F= '/^[[:space:]]*ERIKA_VERSION[[:space:]]*=/ {sub(/^[^=]*=[[:space:]]*/, ""); print; exit}' Config/Erika.version)"
          if [[ -z "$version" ]]; then
            echo "Config/Erika.version 里没有 ERIKA_VERSION= 行" >&2
            exit 3
          fi
          echo "ERIKA_VERSION=$version" >> "$GITHUB_ENV"
          echo "内核版本（来自 Config/Erika.version）: $version"

      - name: Set up Erika kernel
        uses: ./.github/actions/setup-erika
        with:
          erika-version: ${{ env.ERIKA_VERSION }}

      # macOS 测试的 DerivedData。拆 job 前它和 `Packages/*/.build` 合在 `spm-test-v1` 一条里
      # （实测 2665 MiB）；现在各归各的，这条只服务 macOS 这一步 —— 胖了 / 坏了可以单独删掉，
      # 不必连包构建的缓存一起丢。
      #
      # key **不要**带 `github.sha`：那样只有「同一次 run 重跑」才命中，每个 PR 都 miss
      # 却照样 save 一条快照，把 10 GB 仓库额度打成 LRU 抖动（实测曾同时躺着 3 条只差 sha
      # 的僵尸条目）。主键只由 `Package.resolved` 决定 ⇒ 依赖没变的 PR 精确命中，且命中
      # 的运行**不会再写一条新的**。`-v1-` 是留给将来的失效旋钮（换 runner 镜像 / Xcode 大版本时 bump）。
      #
      # ⚠️ **实测：「用旧 key 兜底一轮」这种做法命中不了，所以没有写。** 缓存条目的身份是 **(key, version)**
      # 二元组，`version = sha256(paths|compression|salt)`（actions/toolkit
      # `getCacheVersion`）。旧条目 `spm-test-v1` 的 path 是 `.local-build/ci-test` +
      # `Packages/*/.build` 两条，本条只剩一条 ⇒ **version 不同 ⇒ 旧条目不可见**，
      # 哪怕 key 前缀能对上。证据：拆分后第一次运行两处都打印
      # `Cache not found for input keys: …spm-test-v1-macOS-`，而同期 `ios-dd-v1`
      # （path 没变）能正常按前缀命中 main 上的旧条目。
      # ⇒ 拆 job 的第一次运行必然是冷的（实测 macOS 步 8m14s vs 暖的 4m01s、
      # spm 步 16m59s vs 暖的 4m21s），这是一次性成本，不能靠 fallback 绕过。
      # 旧 `spm-test-v1` 条目（2665 MiB，含两条路径）因此已无用途，可直接删掉。
      - name: Cache macOS DerivedData
        uses: actions/cache@v4
        with:
          path: .local-build/ci-test
          key: mac-dd-v1-${{ runner.os }}-${{ hashFiles('OcPlayer.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved', 'Packages/*/Package.resolved') }}
          restore-keys: |
            mac-dd-v1-${{ runner.os }}-

      # ## `BLD-03`：给 release 打包 job「播种」SPM checkouts
      #
      # 打包 job（`release.yml` 的 macos/ios）在 **tag** 上运行，而**条目不按 ref 共享**
      # 是 GitHub 的规则：tag 上建的缓存读不到、也写不给别的 tag（`BLD-04` 的四次校订
      # 逐条实测过）。所以只在 release.yml 里加缓存是**无效的**——必须有一个跑在
      # 默认分支上的步骤去写那条 key。
      #
      # 这里就是播种点：只在 `main` 上跑（PR 不跑，避免 PR 作用域副本白占额度），
      # 只写不读的那一半由 `actions/cache` 的「精确命中就不重写」语义天然保证。
      # **只留在本 job 里**：三个 job 各跑一份会互相顶掉同一个 key（拆 job 后这是必须项）。
      #
      # 路径选 `.local-build/release*/DerivedData/SourcePackages`：打包脚本要求
      # `$BUILD_ROOT/DerivedData/SourcePackages/checkouts` 存在（`package-*.sh:118`）。
      # 这两个目录由本 job 里**没有**任何步骤生成 —— 所以下面会顺手 resolve 一次。
      - name: Seed release SPM checkouts (main only)
        if: github.ref == 'refs/heads/main'
        shell: bash
        env:
          SKIP_ERIKA_FETCH: "1"
        run: |
          set -euo pipefail
          # ⚠️ **路径必须带 `DerivedData` 这一层**。
          #
          # `xcodebuild -derivedDataPath X` 会把 `SourcePackages` 直接放在 `X/` 下
          # —— 而打包脚本传的是 `-derivedDataPath "$BUILD_ROOT/DerivedData"`，
          # 所以它们的 checkouts 在 `$BUILD_ROOT/DerivedData/SourcePackages`。
          #
          # 第一版这里写的是 `-derivedDataPath .local-build/release`（少一层），
          # 产物落到 `.local-build/release/SourcePackages`，后面的 `cp` 必然
          # `No such file or directory`、`set -e` 下整步失败 —— main 每次 push 都红。
          # 实测确认（本机）：`-derivedDataPath X` → `X/SourcePackages`；
          # `X/DerivedData/SourcePackages` **不存在**。
          xcodebuild -project OcPlayer.xcodeproj -scheme OcPlayer-macOS \
            -derivedDataPath .local-build/release/DerivedData \
            -resolvePackageDependencies

          # 只解析一次，然后复制给 iOS 那个根（两边 checkouts 内容相同）。
          mkdir -p .local-build/release-ios/DerivedData
          rm -rf .local-build/release-ios/DerivedData/SourcePackages
          cp -R .local-build/release/DerivedData/SourcePackages \
                .local-build/release-ios/DerivedData/SourcePackages

      - name: Cache release SPM checkouts (main only)
        if: github.ref == 'refs/heads/main'
        uses: actions/cache@v4
        with:
          path: |
            .local-build/release/DerivedData/SourcePackages
            .local-build/release-ios/DerivedData/SourcePackages
          key: spm-pkg-v1-${{ runner.os }}-${{ hashFiles('OcPlayer.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved', 'Packages/*/Package.resolved') }}
          restore-keys: |
            spm-pkg-v1-${{ runner.os }}-

      # OcPlayer-macOS scheme 的 TestAction 只挂 OcPlayerTests（纯逻辑，不依赖内核/网络/GPU）；
      # 渲染集成测试在 SPM 包内，由 `spm-packages` job 单独跑。
      - name: Run App tests (macOS scheme)
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild \
            -project OcPlayer.xcodeproj \
            -scheme OcPlayer-macOS \
            -configuration Debug \
            -destination 'platform=macOS' \
            -derivedDataPath .local-build/ci-test \
            test

      - name: Upload test logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-logs-macos
          path: |
            .local-build/ci-test/Logs
            .local-build/ci-test/Logs/Test/*.xcresult
          if-no-files-found: ignore

  # ── 2/3  iOS 模拟器 AppTests ──────────────────────────────────────────────
  ios-apptests:
    name: App tests (iOS simulator)
    runs-on: macos-26
    timeout-minutes: 40
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Resolve Erika version
        id: erika-version
        shell: bash
        run: |
          set -euo pipefail
          version="$(awk -F= '/^[[:space:]]*ERIKA_VERSION[[:space:]]*=/ {sub(/^[^=]*=[[:space:]]*/, ""); print; exit}' Config/Erika.version)"
          if [[ -z "$version" ]]; then
            echo "Config/Erika.version 里没有 ERIKA_VERSION= 行" >&2
            exit 3
          fi
          echo "ERIKA_VERSION=$version" >> "$GITHUB_ENV"
          echo "内核版本（来自 Config/Erika.version）: $version"

      - name: Set up Erika kernel
        uses: ./.github/actions/setup-erika
        with:
          erika-version: ${{ env.ERIKA_VERSION }}

      # iOS 这一步是三个 job 里最慢的（805 s，也是拆完之后的**关键路径**）。它的耗时构成是
      # 预热 ~101 s + 编译 ~422 s + 用例 ~110 s + 收尾 ~30 s，前两项正是 DerivedData 里的东西
      # —— 本机同根实测：冷建 116 s → 改两个源文件后增量 14 s，体积 1.9 GB。
      #
      # **单独一条**而不是并进 macOS / 包测试那两条：它只服务 iOS 这一步，胖了 / 坏了
      # 可以单独删掉，不必连 macOS 与包构建的缓存一起丢；key 前缀不同，三者不会互相顶掉。
      # 主键只由 `Package.resolved` 决定 ⇒ 依赖没变的 PR 精确命中、且**命中的运行不会再写
      # 一条新的**（见 PR #29 第二次运行的 `Cache hit occurred on the primary key, not saving
      # cache`）。依赖变了的 PR 会新写一条 ~1.9 GB 的 PR 作用域副本，靠合并后删 PR 副本回收
      # （条目按 ref 隔离，详见 CHANGELOG `BLD-04` 条）。`-v1-` 是失效旋钮：换 runner 镜像 /
      # Xcode 大版本时 bump。
      - name: Cache iOS DerivedData
        uses: actions/cache@v4
        with:
          path: .local-build/ci-test-ios
          key: ios-dd-v1-${{ runner.os }}-${{ hashFiles('OcPlayer.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved', 'Packages/*/Package.resolved') }}
          restore-keys: |
            ios-dd-v1-${{ runner.os }}-

      # iOS 与 macOS 共用同一份 OcPlayerTests 源码（OcPlayerTests-iOS target +
      # OcPlayer-iOS.xcscheme 早已存在），此前 CI 只跑 macOS destination，iOS 独有
      # 路径（方向锁、文件选择器生命周期）无回归。runner 可用机型随镜像变化，
      # 用 simctl 动态取第一个可用 iPhone，不写死机型名。
      # ## `BLD-08`：iOS 步的「模拟器启动 + 装机」是波动主因，必须先预热 + 打点
      #
      # 实测（PR #30 四次运行）：从编译完成到打出首条 App 日志之间**日志全静默**，
      # 那段耗时 **185 / 162 / 331 / 181 s —— 波动 ±170 s**。它不在编译里，缓存对它
      # 完全无效（`BLD-02` 命中缓存后 iOS 步仍 534 s）。
      #
      # 所以这里做三件事（都是**可观测**的，不依赖猜测）：
      # 1. `simctl boot` + `bootstatus -b` 在 `xcodebuild` **之前**把模拟器预热好，
      #    并把这段单独打点；
      # 2. destination 改用 `id=<udid>` —— 跳过 `xcodebuild` 内部的机型解析/可用性探测；
      # 3. 给「boot+装机+拉起 runner」这段加**预算告警**（超过 `IOS_SIM_BUDGET_S`
      #    就在日志里显式标注，不再让这 ±170 s 悄悄溜过去）。
      - name: Run App tests (iOS simulator)
        shell: bash
        run: |
          set -euo pipefail
          # 预算：这段超过它就在日志里显式标红（不 fail —— 慢是 runner 的事，
          # 不该让一个性能观测点变成 flaky 门禁）。
          IOS_SIM_BUDGET_S=120

          udid="$(xcrun simctl list devices available -j \
            | jq -r '[.devices[][] | select(.name | startswith("iPhone"))][0].udid')"
          name="$(xcrun simctl list devices available -j \
            | jq -r '[.devices[][] | select(.name | startswith("iPhone"))][0].name')"
          if [[ -z "$udid" || "$udid" == "null" ]]; then
            echo "No iPhone simulator available on this runner" >&2
            exit 1
          fi
          echo "==> iOS simulator: $name ($udid)"

          # ① 预热：boot + 等到完全就绪（这是 `xcodebuild` 原本自己要做、且静默的那段）。
          sim_start=$(date +%s)
          xcrun simctl boot "$udid" 2>/dev/null || true   # 已 boot 时返回非 0，忽略
          xcrun simctl bootstatus "$udid" -b
          sim_ready=$(( $(date +%s) - sim_start ))
          echo "[BLD-08] simulator ready in ${sim_ready}s"

          # ② 用 id= 跳过机型解析；并记录整步耗时以便和预算对比。
          test_start=$(date +%s)
          xcodebuild \
            -project OcPlayer.xcodeproj \
            -scheme OcPlayer-iOS \
            -configuration Debug \
            -destination "platform=iOS Simulator,id=$udid" \
            -derivedDataPath .local-build/ci-test-ios \
            test
          test_elapsed=$(( $(date +%s) - test_start ))
          echo "[BLD-08] xcodebuild test took ${test_elapsed}s (预热 ${sim_ready}s)"

          # ③ 预算告警：**只量预热那段**（`sim_ready`），不量整个 xcodebuild。
          #
          # 第一版比的是 `total`（预热 + 整个 xcodebuild test）—— 而 iOS 步本来
          # 就 462–627 s，`>120` 恒成立，等于每次运行都告警，是纯噪声。
          # 清单要观测的是「模拟器启动 + 装机」那 162–331 s 的静默段，预热正是兑它，
          # 所以预算只能盯 `sim_ready`。
          if (( sim_ready > IOS_SIM_BUDGET_S )); then
            echo "::warning title=iOS 模拟器预热超预算::[BLD-08] 预热 ${sim_ready}s > 预算 ${IOS_SIM_BUDGET_S}s —— 见 BLD-08"
          fi

      - name: Upload test logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-logs-ios
          path: |
            .local-build/ci-test-ios/Logs
            .local-build/ci-test-ios/Logs/Test/*.xcresult
          if-no-files-found: ignore

  # ── 3/3  SwiftPM 包测试 ───────────────────────────────────────────────────
  spm-packages:
    name: SwiftPM package tests
    runs-on: macos-26
    timeout-minutes: 40
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Resolve Erika version
        id: erika-version
        shell: bash
        run: |
          set -euo pipefail
          version="$(awk -F= '/^[[:space:]]*ERIKA_VERSION[[:space:]]*=/ {sub(/^[^=]*=[[:space:]]*/, ""); print; exit}' Config/Erika.version)"
          if [[ -z "$version" ]]; then
            echo "Config/Erika.version 里没有 ERIKA_VERSION= 行" >&2
            exit 3
          fi
          echo "ERIKA_VERSION=$version" >> "$GITHUB_ENV"
          echo "内核版本（来自 Config/Erika.version）: $version"

      - name: Set up Erika kernel
        uses: ./.github/actions/setup-erika
        with:
          erika-version: ${{ env.ERIKA_VERSION }}

      # 每个包自己的 `.build/`。拆 job 前它和 macOS 的 `.local-build/ci-test` 合在
      # `spm-test-v1` 一条里（实测 2665 MiB 是两条路径之和）；现在 path 收窄到只剩
      # `Packages/*/.build`，改用 `spm-test-v2` 主键 —— **必须换 key**：同一个 key 配不同
      # path 会让「命中就不重写」的语义把新内容永久丢掉（见文件头 `BLD-09`）。
      #
      # 前缀 `spm-test-` 是必需的：release.yml 那个块缓存的是**不同路径**
      # （ci-release-test），两边 key 若逐字相同会互相顶掉。`-v2-` 是失效旋钮。
      #
      # ⚠️ **不要**加 `spm-test-v1-` 之类的「过渡 fallback」——实测过，永远不会命中：
      # 缓存条目的身份是 **(key, version)**，`version = sha256(paths|compression|salt)`
      # （actions/toolkit `getCacheVersion`）。旧条目的 path 是
      # `.local-build/ci-test` + `Packages/*/.build` 两条，本条只剩一条 ⇒ version 不同
      # ⇒ 旧条目不可见，哪怕 key 前缀对得上。证据：拆分后第一次运行打印
      # `Cache not found for input keys: …spm-test-v1-macOS-`，而 path 没变的
      # `ios-dd-v1` 同期能正常按前缀命中 main 上的旧条目。
      # ⇒ 第一次运行必然冷编（实测本例 16m59s vs 暖的 4m21s），是一次性成本。
      - name: Cache SwiftPM builds
        uses: actions/cache@v4
        with:
          path: Packages/*/.build
          key: spm-test-v2-${{ runner.os }}-${{ hashFiles('OcPlayer.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved', 'Packages/*/Package.resolved') }}
          restore-keys: |
            spm-test-v2-${{ runner.os }}-

      - name: Run SwiftPM package tests
        shell: bash
        run: |
          set -euo pipefail
          python3 -B -m unittest discover -s Scripts/tests
          for pkg in \
              Packages/AppDesignKit \
              Packages/CoreModel \
              Packages/DiagnosticsKit \
              Packages/PlaybackKit \
              Packages/DanmakuKit \
              Packages/DanmakuRenderKit \
              Packages/JellyfinKit \
              Packages/BangumiKit \
              Packages/MetadataKit \
              Packages/MoviePilotKit; do
            echo "==> $pkg"
            swift test --package-path "$pkg"
          done
          # ErikaKit 里实例化 ErikaPresenter 的 Swift Testing suite 依赖 Metal / 真内核，
          # 无 GPU 的 GitHub runner 上会直接 hang（不是报错），只能全 skip：
          # 离屏渲染 / C ABI 冒烟 / 打开真文件 / HTTP 直连 / 播放生命周期 / 内存快照
          # / 预读行为（会 try ErikaPresenter()，随预读内核 API 加入）。
          # 留下的 XCTest（弹幕 JSON/配置/轨道/状态）是纯逻辑，不碰内核。
          echo "==> Packages/ErikaKit (excluding presenter-dependent suites)"
          swift test --package-path Packages/ErikaKit \
            --skip ErikaRenderTests --skip ErikaSmokeTests --skip ErikaOpenFileTests \
            --skip ErikaHTTPHeaderTests --skip ErikaLifecycleTests --skip ErikaMemorySnapshotTests \
            --skip ErikaReadAheadBehaviorTests
