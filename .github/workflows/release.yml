name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag, for example v0.1.0"
        required: true

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # 测试门禁：tag 直接 push 时不经过 Test 工作流的 PR/push 触发也能保证
  # 「发出去的包构建在测试过的代码上」。Erika 环境准备收敛在
  # .github/actions/setup-erika，与 test.yml 共用同一份定义。
  tests:
    name: Tests (AppTests + SwiftPM packages)
    runs-on: macos-26
    timeout-minutes: 45
    env:
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 门禁必须测**要发布的那个 commit**：此前这里只 checkout 默认 ref（分支
      # HEAD），而打包 job checkout 的是 tag。内核版本从 Config/Erika.version 读之后
      # 这个差异会变成实质风险——HEAD 与 tag 的钉点一旦不同，就会「测的内核 ≠ 发的
      # 内核」，正是本文件注释要防的那件事。
      - name: Check out release commit
        shell: bash
        run: |
          set -euo pipefail
          git fetch --tags origin
          if ! git rev-parse -q --verify "refs/tags/$RELEASE_TAG" >/dev/null; then
            echo "Tag $RELEASE_TAG does not exist; push it first or create it on the commit to release" >&2
            exit 2
          fi
          git checkout "$RELEASE_TAG"

      - name: Resolve Erika version
        id: erika-version
        shell: bash
        run: |
          set -euo pipefail
          version="$(awk -F= '/^[[:space:]]*ERIKA_VERSION[[:space:]]*=/ {sub(/^[^=]*=[[:space:]]*/, ""); print; exit}' Config/Erika.version)"
          if [[ -z "$version" ]]; then
            echo "Config/Erika.version 里没有 ERIKA_VERSION= 行" >&2
            exit 3
          fi
          echo "ERIKA_VERSION=$version" >> "$GITHUB_ENV"
          echo "内核版本（来自 Config/Erika.version）: $version"

      - name: Set up Erika kernel
        uses: ./.github/actions/setup-erika
        with:
          erika-version: ${{ env.ERIKA_VERSION }}

      - name: Cache SwiftPM builds
        uses: actions/cache@v4
        with:
          path: |
            .local-build/ci-release-test
            Packages/*/.build
          key: spm-${{ runner.os }}-${{ hashFiles('**/Package.resolved') }}-${{ github.sha }}
          restore-keys: |
            spm-${{ runner.os }}-${{ hashFiles('**/Package.resolved') }}-
            spm-${{ runner.os }}-

      - name: Run App tests (macOS scheme)
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild \
            -project OcPlayer.xcodeproj \
            -scheme OcPlayer-macOS \
            -configuration Debug \
            -destination 'platform=macOS' \
            -derivedDataPath .local-build/ci-release-test \
            test

      # 与 test.yml 对齐：发版门禁此前只跑 macOS，iOS 测试 target 在
      # workflow_dispatch（直接打 tag 发版）这条路径上**从未跑过**——于是发版门禁
      # 比 PR 门禁还弱，而 iOS 恰恰是 0.2.0 出过导航死按钮的那一端。机型用 simctl
      # 动态取，不写死。
      - name: Run App tests (iOS simulator)
        shell: bash
        run: |
          set -euo pipefail
          device="$(xcrun simctl list devices available -j \
            | jq -r '[.devices[][] | select(.name | startswith("iPhone"))][0].name')"
          if [[ -z "$device" || "$device" == "null" ]]; then
            echo "No iPhone simulator available on this runner" >&2
            exit 1
          fi
          echo "==> iOS simulator: $device"
          xcodebuild \
            -project OcPlayer.xcodeproj \
            -scheme OcPlayer-iOS \
            -configuration Debug \
            -destination "platform=iOS Simulator,name=$device" \
            -derivedDataPath .local-build/ci-release-test-ios \
            test

      - name: Run SwiftPM package tests
        shell: bash
        run: |
          set -euo pipefail
          for pkg in \
              Packages/AppDesignKit \
              Packages/CoreModel \
              Packages/DiagnosticsKit \
              Packages/PlaybackKit \
              Packages/DanmakuKit \
              Packages/DanmakuRenderKit \
              Packages/JellyfinKit \
              Packages/BangumiKit \
              Packages/MetadataKit \
              Packages/MoviePilotKit; do
            echo "==> $pkg"
            swift test --package-path "$pkg"
          done
          echo "==> Packages/ErikaKit (excluding presenter-dependent suites)"
          swift test --package-path Packages/ErikaKit \
            --skip ErikaRenderTests --skip ErikaSmokeTests --skip ErikaOpenFileTests \
            --skip ErikaHTTPHeaderTests --skip ErikaLifecycleTests --skip ErikaMemorySnapshotTests \
            --skip ErikaReadAheadBehaviorTests

  macos:
    name: Build macOS arm64
    needs: tests
    runs-on: macos-26
    timeout-minutes: 60
    env:
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}

    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check out dispatch tag
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        run: |
          set -euo pipefail
          git fetch --tags origin
          if ! git rev-parse -q --verify "refs/tags/$RELEASE_TAG" >/dev/null; then
            echo "Tag $RELEASE_TAG does not exist; push it first or create it on the commit to release" >&2
            exit 2
          fi
          git checkout "$RELEASE_TAG"

      - name: Validate release environment
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([-+][A-Za-z0-9.-]+)?$ ]]; then
            echo "Release tag must look like v0.1.0" >&2
            exit 2
          fi
          xcodebuild -version
          sdk_version="$(xcrun --sdk macosx --show-sdk-version)"
          if (( ${sdk_version%%.*} < 26 )); then
            echo "OcPlayer requires the macOS 26 SDK; runner has $sdk_version" >&2
            exit 1
          fi

      - name: Resolve Erika version
        id: erika-version
        shell: bash
        run: |
          set -euo pipefail
          version="$(awk -F= '/^[[:space:]]*ERIKA_VERSION[[:space:]]*=/ {sub(/^[^=]*=[[:space:]]*/, ""); print; exit}' Config/Erika.version)"
          if [[ -z "$version" ]]; then
            echo "Config/Erika.version 里没有 ERIKA_VERSION= 行" >&2
            exit 3
          fi
          echo "ERIKA_VERSION=$version" >> "$GITHUB_ENV"
          echo "内核版本（来自 Config/Erika.version）: $version"

      - name: Set up Erika kernel
        uses: ./.github/actions/setup-erika
        with:
          erika-version: ${{ env.ERIKA_VERSION }}

      - name: Free disk space for packaging
        shell: bash
        run: |
          set -euo pipefail
          df -h /
          # macOS runner 镜像里模拟器运行时能占几个 GB，而两个打包 job 都是
          # `generic/platform=` 设备构建，用不上它——dmg 阶段的 ENOSPC 就出在这里。
          sudo rm -rf /Library/Developer/CoreSimulator/Profiles/Runtimes/* || true
          rm -rf ~/Library/Developer/CoreSimulator/Caches/* || true
          rm -rf ~/Library/Developer/Xcode/DerivedData/* || true
          # 内核已由 setup-erika 拉取并校验，打包阶段用 SKIP_ERIKA_FETCH 复用它，
          # 下载缓存（每个平台约 100–200 MB）没有留着的必要。
          rm -f Vendor/downloads/*.zip
          df -h /

      - name: Build release packages
        shell: bash
        env:
          SKIP_ERIKA_FETCH: "1"
        run: Scripts/package-macos.sh "$RELEASE_TAG"

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: OcPlayer-${{ env.RELEASE_TAG }}-macOS-arm64
          path: dist/*
          if-no-files-found: error

      - name: Create or update GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" dist/* --clobber
            exit 0
          fi

          flags=(--title "OcPlayer $RELEASE_TAG" --target "$GITHUB_SHA" --generate-notes)
          if [[ "$RELEASE_TAG" == *-* ]]; then
            flags+=(--prerelease)
          fi
          gh release create "$RELEASE_TAG" dist/* "${flags[@]}"

  ios:
    name: Build iOS (iPhone + iPad)
    # 排在 macOS 之后：Release 由 macOS job 创建，这里只上传，避免并发建 release 竞态。
    needs: macos
    runs-on: macos-26
    timeout-minutes: 60
    env:
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}

    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check out dispatch tag
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        run: |
          set -euo pipefail
          git fetch --tags origin
          if ! git rev-parse -q --verify "refs/tags/$RELEASE_TAG" >/dev/null; then
            echo "Tag $RELEASE_TAG does not exist; push it first or create it on the commit to release" >&2
            exit 2
          fi
          git checkout "$RELEASE_TAG"

      - name: Validate release environment
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild -version
          sdk_version="$(xcrun --sdk iphoneos --show-sdk-version)"
          if (( ${sdk_version%%.*} < 26 )); then
            echo "OcPlayer requires the iOS 26 SDK; runner has $sdk_version" >&2
            exit 1
          fi

      - name: Resolve Erika version
        id: erika-version
        shell: bash
        run: |
          set -euo pipefail
          version="$(awk -F= '/^[[:space:]]*ERIKA_VERSION[[:space:]]*=/ {sub(/^[^=]*=[[:space:]]*/, ""); print; exit}' Config/Erika.version)"
          if [[ -z "$version" ]]; then
            echo "Config/Erika.version 里没有 ERIKA_VERSION= 行" >&2
            exit 3
          fi
          echo "ERIKA_VERSION=$version" >> "$GITHUB_ENV"
          echo "内核版本（来自 Config/Erika.version）: $version"

      - name: Set up Erika kernel
        uses: ./.github/actions/setup-erika
        with:
          erika-version: ${{ env.ERIKA_VERSION }}

      - name: Free disk space for packaging
        shell: bash
        run: |
          set -euo pipefail
          df -h /
          # 同 macOS job：模拟器运行时用不上（设备构建），内核下载缓存已由
          # setup-erika 校验过，打包阶段直接复用现成的 xcframework。
          sudo rm -rf /Library/Developer/CoreSimulator/Profiles/Runtimes/* || true
          rm -rf ~/Library/Developer/CoreSimulator/Caches/* || true
          rm -rf ~/Library/Developer/Xcode/DerivedData/* || true
          rm -f Vendor/downloads/*.zip
          df -h /

      - name: Build release package
        shell: bash
        env:
          SKIP_ERIKA_FETCH: "1"
        run: Scripts/package-ios.sh "$RELEASE_TAG"

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: OcPlayer-${{ env.RELEASE_TAG }}-iOS
          path: dist/*
          if-no-files-found: error

      - name: Upload to GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release upload "$RELEASE_TAG" dist/* --clobber
