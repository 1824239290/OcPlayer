name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag, for example v0.1.0"
        required: true
        default: "v0.1.0"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  macos:
    name: Build macOS arm64
    runs-on: macos-26
    timeout-minutes: 60
    env:
      ERIKA_VERSION: v0.1.6
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}

    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check out dispatch tag
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        run: |
          set -euo pipefail
          git fetch --tags origin
          if ! git rev-parse -q --verify "refs/tags/$RELEASE_TAG" >/dev/null; then
            echo "Tag $RELEASE_TAG does not exist; push it first or create it on the commit to release" >&2
            exit 2
          fi
          git checkout "$RELEASE_TAG"

      - name: Validate release environment
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([-+][A-Za-z0-9.-]+)?$ ]]; then
            echo "Release tag must look like v0.1.0" >&2
            exit 2
          fi
          xcodebuild -version
          sdk_version="$(xcrun --sdk macosx --show-sdk-version)"
          if (( ${sdk_version%%.*} < 26 )); then
            echo "OcPlayer requires the macOS 26 SDK; runner has $sdk_version" >&2
            exit 1
          fi

      - name: Cache Erika binaries
        uses: actions/cache@v4
        with:
          path: |
            Vendor/downloads
            Packages/ErikaKit/Vendor/Erika.xcframework
          key: erika-${{ runner.os }}-${{ runner.arch }}-${{ env.ERIKA_VERSION }}

      - name: Fetch Erika
        shell: bash
        run: Scripts/fetch-erika.sh "$ERIKA_VERSION"

      - name: Build release packages
        shell: bash
        run: Scripts/package-macos.sh "$RELEASE_TAG"

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: OcPlayer-${{ env.RELEASE_TAG }}-macOS-arm64
          path: dist/*
          if-no-files-found: error

      - name: Create or update GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" dist/* --clobber
            exit 0
          fi

          flags=(--title "OcPlayer $RELEASE_TAG" --target "$GITHUB_SHA" --generate-notes)
          if [[ "$RELEASE_TAG" == *-* ]]; then
            flags+=(--prerelease)
          fi
          gh release create "$RELEASE_TAG" dist/* "${flags[@]}"
