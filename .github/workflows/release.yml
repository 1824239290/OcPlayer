name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag, for example v0.1.0"
        required: true

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # 测试门禁：tag 直接 push 时不经过 Test 工作流的 PR/push 触发也能保证
  # 「发出去的包构建在测试过的代码上」。Erika 环境准备收敛在
  # .github/actions/setup-erika，与 test.yml 共用同一份定义。
  tests:
    name: Tests (AppTests + SwiftPM packages)
    runs-on: macos-26
    timeout-minutes: 45
    env:
      ERIKA_VERSION: v0.1.7+dolby.3
      ERIKA_REPO: 1824239290/Erika

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Erika kernel
        uses: ./.github/actions/setup-erika
        with:
          erika-version: ${{ env.ERIKA_VERSION }}

      - name: Cache SwiftPM builds
        uses: actions/cache@v4
        with:
          path: |
            .local-build/ci-release-test
            Packages/*/.build
          key: spm-${{ runner.os }}-${{ hashFiles('**/Package.resolved') }}-${{ github.sha }}
          restore-keys: |
            spm-${{ runner.os }}-${{ hashFiles('**/Package.resolved') }}-
            spm-${{ runner.os }}-

      - name: Run App tests (macOS scheme)
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild \
            -project OcPlayer.xcodeproj \
            -scheme OcPlayer-macOS \
            -configuration Debug \
            -destination 'platform=macOS' \
            -derivedDataPath .local-build/ci-release-test \
            test

      - name: Run SwiftPM package tests
        shell: bash
        run: |
          set -euo pipefail
          for pkg in \
              Packages/CoreModel \
              Packages/DiagnosticsKit \
              Packages/PlaybackKit \
              Packages/DanmakuKit \
              Packages/DanmakuRenderKit \
              Packages/JellyfinKit \
              Packages/BangumiKit \
              Packages/MoviePilotKit; do
            echo "==> $pkg"
            swift test --package-path "$pkg"
          done
          echo "==> Packages/ErikaKit (excluding presenter-dependent suites)"
          swift test --package-path Packages/ErikaKit \
            --skip ErikaRenderTests --skip ErikaSmokeTests --skip ErikaOpenFileTests \
            --skip ErikaHTTPHeaderTests --skip ErikaLifecycleTests --skip ErikaMemorySnapshotTests \
            --skip ErikaReadAheadBehaviorTests

  macos:
    name: Build macOS arm64
    needs: tests
    runs-on: macos-26
    timeout-minutes: 60
    env:
      # 与 test.yml 保持同一内核来源：release 产物必须构建在测试过的内核上。
      # 内核改动合并上游后，这里与 test.yml、Scripts/build-macos.sh 一起切回官方。
      ERIKA_VERSION: v0.1.7+dolby.3
      ERIKA_REPO: 1824239290/Erika
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}

    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check out dispatch tag
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        run: |
          set -euo pipefail
          git fetch --tags origin
          if ! git rev-parse -q --verify "refs/tags/$RELEASE_TAG" >/dev/null; then
            echo "Tag $RELEASE_TAG does not exist; push it first or create it on the commit to release" >&2
            exit 2
          fi
          git checkout "$RELEASE_TAG"

      - name: Validate release environment
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([-+][A-Za-z0-9.-]+)?$ ]]; then
            echo "Release tag must look like v0.1.0" >&2
            exit 2
          fi
          xcodebuild -version
          sdk_version="$(xcrun --sdk macosx --show-sdk-version)"
          if (( ${sdk_version%%.*} < 26 )); then
            echo "OcPlayer requires the macOS 26 SDK; runner has $sdk_version" >&2
            exit 1
          fi

      - name: Set up Erika kernel
        uses: ./.github/actions/setup-erika
        with:
          erika-version: ${{ env.ERIKA_VERSION }}

      - name: Build release packages
        shell: bash
        run: Scripts/package-macos.sh "$RELEASE_TAG"

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: OcPlayer-${{ env.RELEASE_TAG }}-macOS-arm64
          path: dist/*
          if-no-files-found: error

      - name: Create or update GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" dist/* --clobber
            exit 0
          fi

          flags=(--title "OcPlayer $RELEASE_TAG" --target "$GITHUB_SHA" --generate-notes)
          if [[ "$RELEASE_TAG" == *-* ]]; then
            flags+=(--prerelease)
          fi
          gh release create "$RELEASE_TAG" dist/* "${flags[@]}"

  ios:
    name: Build iOS (iPhone + iPad)
    # 排在 macOS 之后：Release 由 macOS job 创建，这里只上传，避免并发建 release 竞态。
    needs: macos
    runs-on: macos-26
    timeout-minutes: 60
    env:
      # 与 test.yml 保持同一内核来源：release 产物必须构建在测试过的内核上。
      # 内核改动合并上游后，这里与 test.yml、Scripts/package-ios.sh 一起切回官方。
      ERIKA_VERSION: v0.1.7+dolby.3
      ERIKA_REPO: 1824239290/Erika
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}

    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check out dispatch tag
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        run: |
          set -euo pipefail
          git fetch --tags origin
          if ! git rev-parse -q --verify "refs/tags/$RELEASE_TAG" >/dev/null; then
            echo "Tag $RELEASE_TAG does not exist; push it first or create it on the commit to release" >&2
            exit 2
          fi
          git checkout "$RELEASE_TAG"

      - name: Validate release environment
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild -version
          sdk_version="$(xcrun --sdk iphoneos --show-sdk-version)"
          if (( ${sdk_version%%.*} < 26 )); then
            echo "OcPlayer requires the iOS 26 SDK; runner has $sdk_version" >&2
            exit 1
          fi

      - name: Set up Erika kernel
        uses: ./.github/actions/setup-erika
        with:
          erika-version: ${{ env.ERIKA_VERSION }}

      - name: Build release package
        shell: bash
        run: Scripts/package-ios.sh "$RELEASE_TAG"

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: OcPlayer-${{ env.RELEASE_TAG }}-iOS
          path: dist/*
          if-no-files-found: error

      - name: Upload to GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release upload "$RELEASE_TAG" dist/* --clobber
