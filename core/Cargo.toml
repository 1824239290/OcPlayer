[workspace]
resolver = "2"
members = [
    "crates/ocp-model",
    "crates/ocp-http",
    "crates/ocp-store",
    "crates/ocp-jellyfin",
    "crates/ocp-tmdb",
    "crates/ocp-danmaku",
    "crates/ocp-bangumi",
    "crates/ocp-moviepilot",
    "crates/ocp-session",
    "crates/ocp-core",
    "crates/ocp-ffi",
    "crates/ocp-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-only"
repository = "http://192.168.5.107:8418/jumusu/OcPlayer"

[workspace.dependencies]
ocp-model = { path = "crates/ocp-model" }
ocp-http = { path = "crates/ocp-http" }
ocp-store = { path = "crates/ocp-store" }
ocp-jellyfin = { path = "crates/ocp-jellyfin" }
ocp-tmdb = { path = "crates/ocp-tmdb" }
ocp-danmaku = { path = "crates/ocp-danmaku" }
ocp-bangumi = { path = "crates/ocp-bangumi" }
ocp-moviepilot = { path = "crates/ocp-moviepilot" }
ocp-session = { path = "crates/ocp-session" }
ocp-core = { path = "crates/ocp-core" }
ocp-ffi = { path = "crates/ocp-ffi" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["time", "rt", "macros"] }
async-trait = "0.1"
chrono = { version = "0.4", features = ["serde", "clock"] }
regex = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
rusqlite = { version = "0.32", features = ["bundled"] }
sha2 = "0.10"
md-5 = "0.10"
url = "2"
unicode-normalization = "0.1"
unicode-segmentation = "1.12"
base64 = "0.22"
libc = "0.2"

[workspace.metadata.cbindgen]
config = "cbindgen.toml"

